name: 유튜브 새 영상 반영

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국시간 오전 6시 17분
  workflow_dispatch: {}      # Actions 탭에서 '지금 실행' 가능

permissions:
  contents: write
  pages: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 새 영상 확인
        run: node scripts/update-videos.mjs
      - name: 바뀐 내용 커밋
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- videos-auto.js; then
            echo "새 영상 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos-auto.js
          git commit -m "유튜브 새 영상 자동 반영"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
