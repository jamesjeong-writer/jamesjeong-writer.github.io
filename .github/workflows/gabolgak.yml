name: 오늘의 가볼각 최신 글

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 아침 6시(한국 시간)
  workflow_dispatch:        # Actions 화면에서 'Run workflow'로 바로 실행

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 블로그 새 글 읽기
        run: node scripts/update-gabolgak.js .
      - name: 바뀐 것이 있으면 저장하고 사이트 다시 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gabolgak.json img/gabolgak
          if git diff --cached --quiet; then echo "바뀐 글 없음"; exit 0; fi
          git commit -m "오늘의 가볼각 최신 글 갱신"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "사이트 다시 만들기 요청 실패(다음 반영 때 같이 됨)"
